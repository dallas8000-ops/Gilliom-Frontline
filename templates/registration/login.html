{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Gilliom FrontLine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --console:#10151A; --panel:#1B222A; --line:#2A343E; --paper:#EDE7DA;
    --paper-dim:#A9A192; --amber:#E8A33D; --alert:#C1443C;
    --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--console);color:var(--paper);
    font-family:var(--body);display:flex;align-items:center;justify-content:center;
  }
  .card{width:100%;max-width:360px;padding:34px;border:1px solid var(--line);border-radius:4px;background:var(--panel);}
  .mark{width:38px;height:38px;border:1.5px solid var(--amber);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--amber);margin-bottom:16px;}
  h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 4px;}
  p.sub{font-family:var(--mono);font-size:11px;color:var(--paper-dim);letter-spacing:.5px;text-transform:uppercase;margin:0 0 26px;}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--paper-dim);margin:16px 0 6px;}
  input{width:100%;background:var(--console);border:1px solid var(--line);color:var(--paper);padding:10px;border-radius:3px;font-family:var(--body);font-size:14px;}
  button{width:100%;margin-top:22px;padding:11px;background:var(--amber);border:none;border-radius:3px;color:#1a1206;font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{background:#f0b158;}
  .errorlist{color:var(--alert);font-family:var(--mono);font-size:11px;padding-left:0;list-style:none;margin:6px 0 0;}
  .foot{margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--paper-dim);text-align:center;}
  .foot a{color:var(--amber);text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">GF</div>
    <h1>Gilliom FrontLine</h1>
    <p class="sub">Incident &amp; chain-of-custody log</p>
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      {{ form.username }}
      <label for="id_password">Password</label>
      {{ form.password }}
      {% if form.errors %}<ul class="errorlist"><li>Incorrect username or password.</li></ul>{% endif %}
      <button type="submit">Sign in</button>
    </form>
    <div class="foot">No account? <a href="{% url 'signup' %}">Create one</a></div>
  </div>
</body>
</html>
